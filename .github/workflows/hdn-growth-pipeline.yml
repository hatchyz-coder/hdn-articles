name: Legacy HDN Growth Research (Manual Only)

on:
  workflow_dispatch:
    inputs:
      audit_wordpress:
        description: Also audit the existing WordPress article site
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Optional WordPress audit
        if: inputs.audit_wordpress == true
        run: python scripts/audit_wordpress_migration.py

      - name: Run legacy three-source discovery for comparison only
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
        run: |
          python scripts/discover_sources.py
          python scripts/build_opportunity_report.py

      - name: Upload research output
        uses: actions/upload-artifact@v4
        with:
          name: legacy-growth-research-${{ github.run_id }}
          path: |
            data/candidates/latest.json
            data/opportunities/latest.json
            reports/daily/
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        run: |
          echo "Legacy growth research is manual-only. It no longer creates scheduled article PRs or modifies main." >> "$GITHUB_STEP_SUMMARY"
          echo "Production official-source publishing uses the 20-source collector and Official Source Daily Publish workflow." >> "$GITHUB_STEP_SUMMARY"
