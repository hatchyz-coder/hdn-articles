name: Daily Drive Editorial Publish

on:
  workflow_dispatch:
    inputs:
      document_id:
        description: Optional Google Docs file ID for a one-off editorial run
        required: false
        default: ''
        type: string
      min_score:
        description: Minimum editorial score required for publication (production floor is 72)
        required: true
        default: '72'
        type: string
  schedule:
    # Two independent daily slots: 06:00 and 09:00 JST.
    - cron: '0 21 * * *'
    - cron: '0 0 * * *'

permissions:
  actions: write
  contents: write
  pull-requests: write
  pages: read

concurrency:
  group: daily-drive-editorial-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Restore private-seed processing state
        run: |
          mkdir -p data/editorial-drive
          if git ls-remote --exit-code --heads origin editorial-drive-state >/dev/null 2>&1; then
            git fetch origin editorial-drive-state
            git show origin/editorial-drive-state:data/editorial-drive/processed-docs.json > data/editorial-drive/processed-docs.json || true
          fi

      - name: Generate one publication-ready article pair
        id: editorial
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          DRIVE_EDITORIAL_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_LHUB_ARCHIVE_FOLDER_ID }}
          REQUESTED_MIN_SCORE: ${{ inputs.min_score || '72' }}
          DOCUMENT_ID: ${{ inputs.document_id || '' }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail

          # Repository policy never permits the production quality floor to be lowered.
          if ! [[ "$REQUESTED_MIN_SCORE" =~ ^[0-9]+$ ]]; then
            echo "Invalid min_score: $REQUESTED_MIN_SCORE" >&2
            exit 1
          fi
          if [ "$REQUESTED_MIN_SCORE" -lt 72 ]; then
            MIN_SCORE=72
          else
            MIN_SCORE="$REQUESTED_MIN_SCORE"
          fi

          args=(
            scripts/generate_from_drive_editorial.py
            --folder-id "$DRIVE_EDITORIAL_FOLDER_ID"
            --service-account-json "$GOOGLE_SERVICE_ACCOUNT_JSON"
            --min-score "$MIN_SCORE"
            --state-path data/editorial-drive/processed-docs.json
            --report-path /tmp/editorial-drive-run.json
            --max-drive-files 5000
          )
          if [ -n "$DOCUMENT_ID" ]; then args+=(--document-id "$DOCUMENT_ID"); fi

          # A slot should not be wasted merely because the first backlog seed is unsuitable.
          # Evaluate up to three sequential candidates while preserving state between tries.
          # Manual document_id runs remain single-candidate by design.
          REAL_GITHUB_OUTPUT="$GITHUB_OUTPUT"
          MAX_CANDIDATE_TRIES=3
          if [ -n "$DOCUMENT_ID" ]; then MAX_CANDIDATE_TRIES=1; fi
          selected=false
          last_attempt_output=""

          for candidate_try in $(seq 1 "$MAX_CANDIDATE_TRIES"); do
            attempt_output="$(mktemp)"
            last_attempt_output="$attempt_output"
            echo "Editorial candidate attempt ${candidate_try}/${MAX_CANDIDATE_TRIES}"
            GITHUB_OUTPUT="$attempt_output" python "${args[@]}"

            attempt_selected=$(awk -F= '$1=="selected" {value=$2} END {print value}' "$attempt_output")
            attempt_reason=$(awk -F= '$1=="reason" {value=$2} END {print value}' "$attempt_output")
            echo "Candidate attempt ${candidate_try}: selected=${attempt_selected:-false} reason=${attempt_reason:-unknown}"

            if [ "$attempt_selected" = "true" ]; then
              cat "$attempt_output" >> "$REAL_GITHUB_OUTPUT"
              selected=true
              break
            fi
          done

          if [ "$selected" != "true" ] && [ -n "$last_attempt_output" ]; then
            cat "$last_attempt_output" >> "$REAL_GITHUB_OUTPUT"
          fi

      - name: Persist state when no article is suitable
        if: steps.editorial.outputs.selected != 'true'
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          cp data/editorial-drive/processed-docs.json "$tmpdir/processed-docs.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin editorial-drive-state >/dev/null 2>&1; then
            git fetch origin editorial-drive-state
            git worktree add "$tmpdir/state" origin/editorial-drive-state
            cd "$tmpdir/state"
            git checkout -B editorial-drive-state
          else
            git worktree add --detach "$tmpdir/state" HEAD
            cd "$tmpdir/state"
            git checkout --orphan editorial-drive-state
            git rm -r --cached . || true
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p data/editorial-drive
          cp "$tmpdir/processed-docs.json" data/editorial-drive/processed-docs.json
          git add data/editorial-drive/processed-docs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update editorial seed state [skip ci]"
            git push origin editorial-drive-state
          fi

      - name: Report editorial skip
        if: steps.editorial.outputs.selected != 'true'
        run: |
          echo "No article was published in this slot after candidate rotation. Final editorial gate: ${{ steps.editorial.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Finalize social copy with production URL
        if: steps.editorial.outputs.selected == 'true'
        env:
          SLUG: ${{ steps.editorial.outputs.slug }}
        run: python scripts/finalize_social_posts.py --article-path "src/content/articles/${SLUG}.md"

      - name: Lint
        if: steps.editorial.outputs.selected == 'true'
        run: |
          if npm run | grep -q " lint"; then npm run lint; else echo "No lint script configured."; fi

      - name: Typecheck
        if: steps.editorial.outputs.selected == 'true'
        run: |
          if npm run | grep -q " typecheck"; then npm run typecheck; else npx astro check; fi

      - name: Tests
        if: steps.editorial.outputs.selected == 'true'
        run: |
          if npm run | grep -q " test"; then
            npm test
          elif [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "No tests configured."
          fi

      - name: Build
        if: steps.editorial.outputs.selected == 'true'
        run: npm run build

      - name: Migration check
        if: steps.editorial.outputs.selected == 'true'
        run: |
          if npm run | grep -q "migration:check"; then npm run migration:check; else echo "No migration check configured."; fi

      - name: Create and merge audited publication PR
        id: merge
        if: steps.editorial.outputs.selected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.editorial.outputs.slug }}
          SCORE: ${{ steps.editorial.outputs.score }}
        run: |
          set -euo pipefail
          branch="content/daily-drive-${SLUG}-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/content/articles/${SLUG}.md" "src/content/articles-en/${SLUG}.md" "social/${SLUG}/"
          git commit -m "Publish daily editorial article: ${SLUG}"
          git push origin "$branch"

          cat > /tmp/pr-body.md <<EOF
          ## Daily Drive editorial publication

          - Editorial seed: private Google Drive draft (identifier intentionally not exposed)
          - Editorial score: ${SCORE}/100
          - Current web/news research: required during generation
          - Japanese and English: publication-ready pair
          - Social copy: X / LinkedIn / Facebook finalized with production URL

          ## Automated publication gates

          - [x] Private Drive seed is not cited or exposed publicly
          - [x] Current public web sources are used for time-sensitive facts
          - [x] Existing article titles are checked for duplicate intent
          - [x] AI-pattern editorial review is part of the generation prompt
          - [x] Lint / typecheck / tests / build / migration check completed before merge
          - [ ] JP and EN production URLs must return 2xx before this item counts toward the daily target
          EOF

          pr_url=$(gh pr create --base main --head "$branch" --title "Daily editorial: ${SLUG}" --body-file /tmp/pr-body.md)
          pr_number="${pr_url##*/}"
          gh pr merge "$pr_number" --squash --delete-branch
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      # Save the merged state immediately so a deploy outage cannot cause the same private
      # seed to be regenerated into a duplicate article. Status remains `generated`, which
      # is deliberately NOT counted as a published article by the fallback monitor.
      - name: Persist merged state before deploy
        if: steps.editorial.outputs.selected == 'true' && steps.merge.outcome == 'success'
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          cp data/editorial-drive/processed-docs.json "$tmpdir/processed-docs.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin editorial-drive-state >/dev/null 2>&1; then
            git fetch origin editorial-drive-state
            git worktree add "$tmpdir/state" origin/editorial-drive-state
            cd "$tmpdir/state"
            git checkout -B editorial-drive-state
          else
            git worktree add --detach "$tmpdir/state" HEAD
            cd "$tmpdir/state"
            git checkout --orphan editorial-drive-state
            git rm -r --cached . || true
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p data/editorial-drive
          cp "$tmpdir/processed-docs.json" data/editorial-drive/processed-docs.json
          git add data/editorial-drive/processed-docs.json
          if ! git diff --cached --quiet; then
            git commit -m "Record merged editorial article [skip ci]"
            git push origin editorial-drive-state
          fi

      - name: Observe push-triggered Pages deployment
        if: steps.editorial.outputs.selected == 'true' && steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.merge.outputs.main_sha }}
        run: |
          set -euo pipefail
          # main push already triggers deploy-pages.yml. Do not launch a duplicate deployment;
          # duplicate runs can cancel one another because Pages intentionally deploys latest-only.
          run_id=""
          for attempt in $(seq 1 24); do
            run_id=$(gh run list \
              --workflow deploy-pages.yml \
              --branch main \
              --limit 30 \
              --json databaseId,headSha,event \
              --jq ".[] | select(.headSha == \"$MAIN_SHA\" and .event == \"push\") | .databaseId" | head -n 1)
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done

          if [ -n "$run_id" ]; then
            echo "Observing push-triggered Pages run ${run_id} for ${MAIN_SHA}."
            # A newer main deployment may cancel this exact run. That is not a publication
            # failure if the newer deployment contains the article, so production URL
            # verification below remains authoritative.
            gh run watch "$run_id" --exit-status || true
          else
            echo "No exact push deployment was located; production URL verification will decide publication success."
          fi

      - name: Verify JP and EN production URLs and reconcile state
        if: steps.editorial.outputs.selected == 'true' && steps.merge.outcome == 'success'
        env:
          SLUG: ${{ steps.editorial.outputs.slug }}
        run: |
          python scripts/reconcile_editorial_publication_state.py \
            --state-path data/editorial-drive/processed-docs.json \
            --required-slug "$SLUG" \
            --retries 36 \
            --sleep-seconds 10

      - name: Persist publication-confirmed state
        if: steps.editorial.outputs.selected == 'true' && steps.merge.outcome == 'success'
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          cp data/editorial-drive/processed-docs.json "$tmpdir/processed-docs.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin editorial-drive-state
          git worktree add "$tmpdir/state" origin/editorial-drive-state
          cd "$tmpdir/state"
          git checkout -B editorial-drive-state
          mkdir -p data/editorial-drive
          cp "$tmpdir/processed-docs.json" data/editorial-drive/processed-docs.json
          git add data/editorial-drive/processed-docs.json
          if ! git diff --cached --quiet; then
            git commit -m "Confirm editorial publication [skip ci]"
            git push origin editorial-drive-state
          fi

      - name: Publication summary
        if: steps.editorial.outputs.selected == 'true' && success()
        env:
          SLUG: ${{ steps.editorial.outputs.slug }}
          SCORE: ${{ steps.editorial.outputs.score }}
        run: |
          {
            echo "## Drive editorial publication slot"
            echo ""
            echo "Published and verified: https://article.hdnjapan.com/articles/${SLUG}/"
            echo "English verified: https://article.hdnjapan.com/en/articles/${SLUG}/"
            echo "Editorial score: ${SCORE}/100"
            echo "Both production URLs returned 2xx before the item was marked published."
          } >> "$GITHUB_STEP_SUMMARY"
