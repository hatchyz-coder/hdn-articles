name: Daily Drive Editorial Publish

on:
  workflow_dispatch:
    inputs:
      document_id:
        description: Optional Google Docs file ID for a one-off editorial run
        required: false
        default: ''
        type: string
  schedule:
    # Four distributed daily slots in JST. Minute offsets avoid the top-of-hour load peak.
    # Daily preflight stops later slots before dependency setup once the two-article daily target is reached.
    - cron: '17 21 * * *' # 06:17 JST
    - cron: '23 0 * * *'  # 09:23 JST
    - cron: '37 3 * * *'  # 12:37 JST
    - cron: '43 8 * * *'  # 17:43 JST

permissions:
  actions: write
  contents: write
  pull-requests: write
  pages: read

concurrency:
  group: daily-drive-editorial-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Daily LHub preflight
        id: preflight
        run: python3 scripts/lhub_daily_preflight.py

      - name: Report already-published preflight
        if: steps.preflight.outputs.published == 'true'
        run: |
          {
            echo "## LHub Daily Guarantee preflight"
            echo ""
            echo "Result: daily_target_reached"
            echo "Published count: ${{ steps.preflight.outputs.published_count }}/${{ steps.preflight.outputs.daily_target }}"
            echo "Full pipeline skipped before Python/Node dependency setup."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        if: steps.preflight.outputs.published != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        if: steps.preflight.outputs.published != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.preflight.outputs.published != 'true'
        run: |
          pip install -r requirements.txt
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Restore private-seed processing state
        if: steps.preflight.outputs.published != 'true'
        run: |
          mkdir -p data/editorial-drive
          if git ls-remote --exit-code --heads origin editorial-drive-state >/dev/null 2>&1; then
            git fetch origin editorial-drive-state
            git show origin/editorial-drive-state:data/editorial-drive/processed-docs.json > data/editorial-drive/processed-docs.json || true
          fi

      - name: Generate one publication-ready article pair
        id: editorial
        if: steps.preflight.outputs.published != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HDN_GROQ_MODEL: ${{ vars.HDN_GROQ_MODEL || 'groq/compound-mini' }}
          HDN_GROQ_FALLBACK_MODEL: ${{ vars.HDN_GROQ_FALLBACK_MODEL || 'openai/gpt-oss-20b' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          DRIVE_EDITORIAL_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_LHUB_ARCHIVE_FOLDER_ID }}
          DOCUMENT_ID: ${{ inputs.document_id || '' }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          args=(
            --folder-id "$DRIVE_EDITORIAL_FOLDER_ID"
            --service-account-json "$GOOGLE_SERVICE_ACCOUNT_JSON"
            --min-score 0
            --state-path data/editorial-drive/processed-docs.json
            --report-path /tmp/editorial-drive-run.json
            --max-drive-files 500
          )
          if [ -n "$DOCUMENT_ID" ]; then args+=(--document-id "$DOCUMENT_ID"); fi
          python scripts/lhub_daily_guarantee.py \
            --reserve-dir fallback/lhub \
            --state-path data/editorial-drive/processed-docs.json \
            --max-attempts 4 \
            --backoff-seconds 8 \
            --report-path /tmp/editorial-drive-run.json \
            -- "${args[@]}"

      - name: Report reserve inventory
        if: steps.preflight.outputs.published != 'true'
        env:
          RESERVE_REMAINING: ${{ steps.editorial.outputs.reserve_remaining }}
          RESERVE_HEALTH: ${{ steps.editorial.outputs.reserve_health }}
        run: |
          {
            echo "## LHub reserve inventory"
            echo ""
            echo "Reserve remaining: ${RESERVE_REMAINING:-unknown}"
            echo "Reserve health: ${RESERVE_HEALTH:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESERVE_HEALTH" = "critical" ]; then
            echo "::warning title=LHub reserve critical::Only ${RESERVE_REMAINING} unused reserves remain. Target is 14."
          elif [ "$RESERVE_HEALTH" = "warning" ]; then
            echo "::warning title=LHub reserve warning::Only ${RESERVE_REMAINING} unused reserves remain. Target is 14."
          fi

      - name: Persist state when no article is suitable
        if: steps.preflight.outputs.published != 'true' && steps.editorial.outputs.selected != 'true'
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          cp data/editorial-drive/processed-docs.json "$tmpdir/processed-docs.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin editorial-drive-state >/dev/null 2>&1; then
            git fetch origin editorial-drive-state
            git worktree add "$tmpdir/state" origin/editorial-drive-state
            cd "$tmpdir/state"
            git checkout -B editorial-drive-state
          else
            git worktree add --detach "$tmpdir/state" HEAD
            cd "$tmpdir/state"
            git checkout --orphan editorial-drive-state
            git rm -r --cached . || true
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p data/editorial-drive
          cp "$tmpdir/processed-docs.json" data/editorial-drive/processed-docs.json
          git add data/editorial-drive/processed-docs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update editorial seed state [skip ci]"
            git push origin editorial-drive-state
          fi

      - name: Report editorial skip
        if: steps.preflight.outputs.published != 'true' && steps.editorial.outputs.selected != 'true'
        run: |
          echo "No article was published in this slot. Editorial gate: ${{ steps.editorial.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"


      - name: Publication fact gate
        id: fact_gate
        if: steps.editorial.outputs.selected == 'true'
        env:
          SLUG: ${{ steps.editorial.outputs.slug }}
        run: |
          set +e
          python scripts/publication_fact_gate.py \
            --article-path "src/content/articles/${SLUG}.md" \
            --report-path /tmp/fact-gate-jp.json
          jp_status=$?
          python scripts/publication_fact_gate.py \
            --article-path "src/content/articles-en/${SLUG}.md" \
            --report-path /tmp/fact-gate-en.json
          en_status=$?
          set -e

          if [ "$jp_status" -eq 0 ] && [ "$en_status" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "reason=ok" >> "$GITHUB_OUTPUT"
          else
            reason=$(python - <<'PY'
          import json
          from pathlib import Path
          for path in (Path("/tmp/fact-gate-jp.json"), Path("/tmp/fact-gate-en.json")):
              if path.exists():
                  data = json.loads(path.read_text(encoding="utf-8"))
                  if not data.get("publication_fact_gate", False):
                      print(data.get("reason", "publication_fact_gate_failed"))
                      break
          else:
              print("publication_fact_gate_failed")
          PY
            )
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
          fi

      - name: Report publication fact gate block
        if: steps.editorial.outputs.selected == 'true' && steps.fact_gate.outputs.passed != 'true'
        run: |
          {
            echo "## Publication Fact Gate"
            echo ""
            echo "Publication blocked before PR creation."
            echo "Reason: ${{ steps.fact_gate.outputs.reason }}"
            echo "The Drive seed was not persisted as published; a later slot may regenerate it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Finalize social copy with production URL
        if: steps.editorial.outputs.selected == 'true' && steps.fact_gate.outputs.passed == 'true'
        env:
          SLUG: ${{ steps.editorial.outputs.slug }}
        run: python scripts/finalize_social_posts.py --article-path "src/content/articles/${SLUG}.md"

      - name: Lint
        if: steps.editorial.outputs.selected == 'true' && steps.fact_gate.outputs.passed == 'true'
        run: |
          if npm run | grep -q " lint"; then npm run lint; else echo "No lint script configured."; fi

      - name: Typecheck
        if: steps.editorial.outputs.selected == 'true' && steps.fact_gate.outputs.passed == 'true'
        run: |
          if npm run | grep -q " typecheck"; then npm run typecheck; else npx astro check; fi

      - name: Tests
        if: steps.editorial.outputs.selected == 'true' && steps.fact_gate.outputs.passed == 'true'
        run: |
          if npm run | grep -q " test"; then
            npm test
          elif [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "No tests configured."
          fi

      - name: Build
        if: steps.editorial.outputs.selected == 'true' && steps.fact_gate.outputs.passed == 'true'
        run: npm run build

      - name: Migration check
        if: steps.editorial.outputs.selected == 'true' && steps.fact_gate.outputs.passed == 'true'
        run: |
          if npm run | grep -q "migration:check"; then npm run migration:check; else echo "No migration check configured."; fi

      - name: Create and merge audited publication PR
        id: merge
        if: steps.editorial.outputs.selected == 'true' && steps.fact_gate.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.editorial.outputs.slug }}
          PUBLICATION_MODE: ${{ steps.editorial.outputs.mode || 'generated' }}
          FALLBACK_TRIGGER: ${{ steps.editorial.outputs.fallback_trigger || '' }}
          RESERVE_REMAINING: ${{ steps.editorial.outputs.reserve_remaining || '' }}
        run: |
          set -euo pipefail
          branch="content/daily-drive-${SLUG}-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/content/articles/${SLUG}.md" "src/content/articles-en/${SLUG}.md" "social/${SLUG}/"
          git commit -m "Publish daily editorial article: ${SLUG}"
          git push origin "$branch"

          cat > /tmp/pr-body.md <<EOF
          ## Daily Drive editorial publication

          - Publication mode: ${PUBLICATION_MODE}
          - Fallback trigger: ${FALLBACK_TRIGGER:-none}
          - Reserve remaining: ${RESERVE_REMAINING:-unknown}
          - Source verification: generated articles require current web research; reserve articles are pre-validated against official LHub documentation
          - Japanese and English: publication-ready pair
          - Social copy: X / LinkedIn / Facebook finalized with production URL

          ## Automated publication gates

          - [x] The JST daily target is two LHub articles; later slots stop once the target is reached
          - [x] Japanese and English Publication Fact Gates passed
          - [x] Generated mode uses current public research; reserve mode uses pre-validated official LHub documentation
          - [x] Reserve reuse is blocked by state and existing-slug checks
          - [x] Lint / typecheck / tests / build / migration check completed before merge
          EOF

          pr_url=$(gh pr create --base main --head "$branch" --title "Daily editorial: ${SLUG}" --body-file /tmp/pr-body.md)
          pr_number="${pr_url##*/}"
          gh pr merge "$pr_number" --squash --delete-branch
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Persist state after successful publication merge
        if: steps.editorial.outputs.selected == 'true' && steps.fact_gate.outputs.passed == 'true' && steps.merge.outcome == 'success'
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          cp data/editorial-drive/processed-docs.json "$tmpdir/processed-docs.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin editorial-drive-state >/dev/null 2>&1; then
            git fetch origin editorial-drive-state
            git worktree add "$tmpdir/state" origin/editorial-drive-state
            cd "$tmpdir/state"
            git checkout -B editorial-drive-state
          else
            git worktree add --detach "$tmpdir/state" HEAD
            cd "$tmpdir/state"
            git checkout --orphan editorial-drive-state
            git rm -r --cached . || true
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p data/editorial-drive
          cp "$tmpdir/processed-docs.json" data/editorial-drive/processed-docs.json
          git add data/editorial-drive/processed-docs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update editorial seed state [skip ci]"
            git push origin editorial-drive-state
          fi

      - name: Deploy published article
        if: steps.editorial.outputs.selected == 'true' && steps.fact_gate.outputs.passed == 'true' && steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.merge.outputs.main_sha }}
        run: |
          set -euo pipefail
          gh workflow run deploy-pages.yml --ref main
          run_id=""
          for attempt in $(seq 1 20); do
            run_id=$(gh run list \
              --workflow deploy-pages.yml \
              --event workflow_dispatch \
              --branch main \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$MAIN_SHA\") | .databaseId" | head -n 1)
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          if [ -z "$run_id" ]; then
            echo "Could not locate Pages deployment for $MAIN_SHA" >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status

      - name: Publication summary
        if: steps.editorial.outputs.selected == 'true' && steps.fact_gate.outputs.passed == 'true'
        env:
          SLUG: ${{ steps.editorial.outputs.slug }}
          PUBLICATION_MODE: ${{ steps.editorial.outputs.mode || 'generated' }}
          FALLBACK_TRIGGER: ${{ steps.editorial.outputs.fallback_trigger || '' }}
          RESERVE_REMAINING: ${{ steps.editorial.outputs.reserve_remaining || '' }}
        run: |
          {
            echo "## Drive editorial publication slot"
            echo ""
            echo "Published: https://article.hdnjapan.com/articles/${SLUG}/"
            echo "English: https://article.hdnjapan.com/en/articles/${SLUG}/"
            echo "Publication mode: ${PUBLICATION_MODE}"
            if [ -n "${FALLBACK_TRIGGER}" ]; then echo "Fallback trigger: ${FALLBACK_TRIGGER}"; fi
            echo "Reserve remaining: ${RESERVE_REMAINING:-unknown}"
            echo "Daily Guarantee enforces the two-article daily target and records publication mode."
          } >> "$GITHUB_STEP_SUMMARY"
