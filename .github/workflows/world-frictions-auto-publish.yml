name: World Frictions Auto Publish

on:
  schedule:
    - cron: '17 8 * * 1,3,5'
    - cron: '17 10 * * 1,3,5'
    - cron: '17 12 * * 1,3,5'
    - cron: '17 14 * * 1,3,5'
  workflow_run:
    workflows:
      - Official Source Daily Publish
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - '.github/workflows/world-frictions-auto-publish.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  pages: read

concurrency:
  group: world-frictions-auto-publish
  cancel-in-progress: false

jobs:
  research-review-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      WORLD_FRICTIONS_PROVIDER_CHAIN: 'groq'
      WORLD_FRICTIONS_GROQ_MODEL: ${{ vars.WORLD_FRICTIONS_GROQ_MODEL || 'groq/compound' }}
      WORLD_FRICTIONS_SCORE_THRESHOLD: '86'
      WORLD_FRICTIONS_REVIEW_THRESHOLD: '88'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve run eligibility and daily idempotency
        id: daily_guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          jst = timezone(timedelta(hours=9))
          now = datetime.now(jst)
          target_date = now.date().isoformat()
          weekday = now.isoweekday()
          event_name = os.environ.get('EVENT_NAME', '')
          normal_day = weekday in {1, 3, 5}
          eligible_event = event_name == 'workflow_dispatch' or normal_day
          already_published = False
          existing_slug = ''
          if eligible_event:
              for path in sorted(Path('src/content/articles').glob('*.md')):
                  text = path.read_text(encoding='utf-8')
                  if 'section: "world-frictions"' not in text and 'series: "world-frictions"' not in text:
                      continue
                  match = re.search(r'^publishedAt:\s*["\']?(\d{4}-\d{2}-\d{2})', text, flags=re.MULTILINE)
                  if match and match.group(1) == target_date:
                      already_published = True
                      existing_slug = path.stem
                      break
          run = eligible_event and not already_published
          if not eligible_event:
              reason = f'outside-normal-publication-day:{target_date}'
          elif already_published:
              reason = f'already-published:{existing_slug}'
          else:
              reason = f'eligible:{event_name}:{target_date}'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'run={str(run).lower()}\n')
              handle.write(f'target_date={target_date}\n')
              handle.write(f'reason={reason}\n')
          print(reason)
          PY

      - name: Stop duplicate or out-of-window retry cleanly
        if: steps.daily_guard.outputs.run != 'true'
        run: echo "World Frictions skipped — ${{ steps.daily_guard.outputs.reason }}"

      - name: Setup Node.js
        if: steps.daily_guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Python
        if: steps.daily_guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        if: steps.daily_guard.outputs.run == 'true'
        run: |
          npm install --no-audit --no-fund
          python -m pip install --disable-pip-version-check requests pillow
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Research generate and review with free provider only
        if: steps.daily_guard.outputs.run == 'true'
        id: generate
        continue-on-error: true
        run: python scripts/generate_world_frictions_multillm.py

      - name: Stop cleanly when free generation is unavailable or gates fail
        if: steps.daily_guard.outputs.run == 'true' && (steps.generate.outcome != 'success' || steps.generate.outputs.publish != 'true')
        run: |
          echo "No World Frictions article published. Paid-provider fallback is intentionally disabled."
          echo "Generator outcome: ${{ steps.generate.outcome }}"
          echo "Reason: ${{ steps.generate.outputs.reason }}"

      - name: Validate complete distribution bundle
        if: steps.generate.outcome == 'success' && steps.generate.outputs.publish == 'true'
        run: python scripts/validate_world_frictions_bundle.py --slug "${{ steps.generate.outputs.slug }}" --phase final
      - name: Generate and verify OGP images
        if: steps.generate.outcome == 'success' && steps.generate.outputs.publish == 'true'
        run: |
          python scripts/generate_og_images.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          slug = "${{ steps.generate.outputs.slug }}"
          for lang in ("ja", "en"):
              path = Path("public/og") / lang / f"{slug}.png"
              if not path.exists(): raise SystemExit(f"Missing OGP: {path}")
              with Image.open(path) as image:
                  if image.size != (1200, 630): raise SystemExit(f"Unexpected OGP size: {image.size}")
          PY
      - name: Typecheck
        if: steps.generate.outcome == 'success' && steps.generate.outputs.publish == 'true'
        run: npm run typecheck
      - name: Tests
        if: steps.generate.outcome == 'success' && steps.generate.outputs.publish == 'true'
        run: python -m unittest discover -s tests -v
      - name: Build
        if: steps.generate.outcome == 'success' && steps.generate.outputs.publish == 'true'
        run: npm run build

      - name: Create auditable publication PR
        if: steps.generate.outcome == 'success' && steps.generate.outputs.publish == 'true'
        id: pr
        env:
          SLUG: ${{ steps.generate.outputs.slug }}
          TITLE: ${{ steps.generate.outputs.title }}
        run: |
          set -euo pipefail
          branch="auto/world-frictions-${SLUG}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "src/content/articles/${SLUG}.md" "src/content/articles-en/${SLUG}.md" "social/${SLUG}/"
          git commit -m "Publish World Frictions: ${SLUG}"
          git push origin "$branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "Auto-publish World Frictions: ${TITLE}" --body "Free-first automated World Frictions publication. Groq free provider only; no paid API fallback. All editorial, source, duplicate, legal, JP/EN and build gates passed.")"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
      - name: Merge automatically after all gates pass
        if: steps.generate.outcome == 'success' && steps.generate.outputs.publish == 'true'
        env:
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: gh pr merge "$PR_URL" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
      - name: Keep staging synchronized with production source
        if: steps.generate.outcome == 'success' && steps.generate.outputs.publish == 'true'
        run: |
          git fetch origin main staging
          git push origin origin/main:staging
      - name: Dispatch production deployment
        if: steps.generate.outcome == 'success' && steps.generate.outputs.publish == 'true'
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
