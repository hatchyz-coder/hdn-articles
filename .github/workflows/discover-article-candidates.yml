name: Legacy Three-Source Candidate Discovery (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover legacy three-source candidates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
        run: python scripts/discover_sources.py

      - name: Upload comparison output
        uses: actions/upload-artifact@v4
        with:
          name: legacy-three-source-discovery-${{ github.run_id }}
          path: data/candidates/latest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        run: |
          echo "Manual comparison only. Production candidate supply uses the 20-source Official Source Collector." >> "$GITHUB_STEP_SUMMARY"
