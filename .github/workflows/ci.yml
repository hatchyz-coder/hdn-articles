name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install OGP generator dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow

      - name: Generate and verify OGP images
        run: |
          python scripts/generate_og_images.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = sorted(Path('public/og').glob('*/*.png'))
          if not files:
              raise SystemExit('No OGP images were generated')
          for path in files:
              with Image.open(path) as image:
                  if image.size != (1200, 630):
                      raise SystemExit(f'Unexpected OGP dimensions for {path}: {image.size}')
          print(f'Verified {len(files)} OGP images at 1200x630')
          PY

      - name: Lint
        run: |
          if npm run | grep -q " lint"; then
            npm run lint
          else
            echo "No lint script configured."
          fi

      - name: Typecheck
        run: |
          if npm run | grep -q " typecheck"; then
            npm run typecheck
          else
            npx astro check
          fi

      - name: Tests
        run: |
          if npm run | grep -q " test"; then
            npm test
          elif [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "No tests configured."
          fi

      - name: Build
        run: npm run build

      - name: Verify LLM site guide
        run: |
          test -s public/llms.txt
          grep -q '^# HDN Articles        run: |
          if npm run | grep -q "migration:check"; then
            npm run migration:check
          else
            echo "No migration:check script; repository has no migration workflow to validate."
          fi
 public/llms.txt
          grep -q 'https://article.hdnjapan.com/rss.xml' public/llms.txt
          test -s dist/llms.txt

      - name: Migration check
        run: |
          if npm run | grep -q "migration:check"; then
            npm run migration:check
          else
            echo "No migration:check script; repository has no migration workflow to validate."
          fi
