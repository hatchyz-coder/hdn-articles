name: Phase 2 audience metadata backfill

on:
  push:
    branches:
      - feat/phase2-audience-metadata-discovery

permissions:
  contents: write

jobs:
  backfill:
    if: ${{ !contains(github.event.head_commit.message, '[skip phase2-backfill]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase2-audience-metadata-discovery
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Backfill explicit metadata
        run: python scripts/backfill_audience_metadata.py --write

      - name: Verify metadata contract
        run: python -m unittest discover -s tests -v

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Commit generated frontmatter
        run: |
          if git diff --quiet; then
            echo "No metadata changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/articles src/content/articles-en
          git commit -m "Backfill explicit audience metadata [skip phase2-backfill]"
          git push origin HEAD:feat/phase2-audience-metadata-discovery
