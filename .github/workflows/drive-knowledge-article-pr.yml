name: Legacy Drive Knowledge Draft (Manual Only)

on:
  workflow_dispatch:
    inputs:
      min_score:
        description: Minimum AI score for this legacy manual diagnostic draft
        required: true
        default: '70'
        type: string
      document_id:
        description: Optional Google Docs file ID
        required: false
        default: ''
        type: string
      dry_run:
        description: Fetch Drive/Docs only without calling OpenAI
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run legacy Drive knowledge diagnostic
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_KNOWLEDGE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_KNOWLEDGE_FOLDER_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          MIN_SCORE: ${{ inputs.min_score || '70' }}
          DOCUMENT_ID: ${{ inputs.document_id || '' }}
          DRY_RUN: ${{ inputs.dry_run || true }}
        run: |
          set -euo pipefail
          args=(
            scripts/generate_from_drive_knowledge.py
            --folder-id "$GOOGLE_DRIVE_KNOWLEDGE_FOLDER_ID"
            --service-account-json "$GOOGLE_SERVICE_ACCOUNT_JSON"
            --min-score "$MIN_SCORE"
            --state-path /tmp/legacy-drive-state.json
            --report-path /tmp/legacy-drive-report.json
            --max-drive-files 5
          )
          if [ -n "$DOCUMENT_ID" ]; then args+=(--document-id "$DOCUMENT_ID"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python "${args[@]}"

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-drive-diagnostic-${{ github.run_id }}
          path: |
            /tmp/legacy-drive-state.json
            /tmp/legacy-drive-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          echo "This workflow is intentionally manual-only and does not publish, create PRs, or compete with the 06:00/09:00 LHub publisher." >> "$GITHUB_STEP_SUMMARY"
