name: Daily Drive Editorial Fallback

on:
  workflow_dispatch:
  schedule:
    # 09:30 JST every day, immediately after the second regular Drive slot.
    - cron: '30 0 * * *'

permissions:
  actions: write
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Tokyo
      GH_TOKEN: ${{ github.token }}
      DAILY_TARGET: '2'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count today's Drive publications
        id: initial
        run: |
          set -euo pipefail
          today="$(TZ=Asia/Tokyo date +%F)"

          count_drive_today() {
            git fetch origin editorial-drive-state >/dev/null 2>&1 || true
            if git show origin/editorial-drive-state:data/editorial-drive/processed-docs.json > /tmp/processed-docs.json 2>/dev/null; then
              python - "$today" <<'PY'
          import json
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          target = sys.argv[1]
          data = json.load(open('/tmp/processed-docs.json', encoding='utf-8'))
          count = 0
          for record in data.get('documents', {}).values():
              if record.get('status') not in {'generated', 'published_manual'}:
                  continue
              raw = record.get('finishedAt')
              if not raw:
                  continue
              try:
                  dt = datetime.fromisoformat(raw.replace('Z', '+00:00'))
                  if dt.astimezone(ZoneInfo('Asia/Tokyo')).date().isoformat() == target:
                      count += 1
              except ValueError:
                  continue
          print(count)
          PY
            else
              echo 0
            fi
          }

          count="$(count_drive_today)"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "$count" -ge "$DAILY_TARGET" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "Daily LHub/Drive target satisfied for ${today}: ${count}/${DAILY_TARGET}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "Daily LHub/Drive target incomplete for ${today}: ${count}/${DAILY_TARGET}. Recovery starts now." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Recover missing publication slots
        if: steps.initial.outputs.complete != 'true'
        run: |
          set -euo pipefail
          today="$(TZ=Asia/Tokyo date +%F)"

          count_drive_today() {
            git fetch origin editorial-drive-state >/dev/null 2>&1 || true
            if git show origin/editorial-drive-state:data/editorial-drive/processed-docs.json > /tmp/processed-docs.json 2>/dev/null; then
              python - "$today" <<'PY'
          import json
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          target = sys.argv[1]
          data = json.load(open('/tmp/processed-docs.json', encoding='utf-8'))
          count = 0
          for record in data.get('documents', {}).values():
              if record.get('status') not in {'generated', 'published_manual'}:
                  continue
              raw = record.get('finishedAt')
              if not raw:
                  continue
              try:
                  dt = datetime.fromisoformat(raw.replace('Z', '+00:00'))
                  if dt.astimezone(ZoneInfo('Asia/Tokyo')).date().isoformat() == target:
                      count += 1
              except ValueError:
                  continue
          print(count)
          PY
            else
              echo 0
            fi
          }

          # Move past unsuitable drafts and transient API failures without lowering quality.
          for attempt in 1 2 3 4 5 6 7 8; do
            count="$(count_drive_today)"
            if [ "$count" -ge "$DAILY_TARGET" ]; then
              echo "Recovered LHub/Drive target: ${count}/${DAILY_TARGET}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "Recovery attempt ${attempt}: ${count}/${DAILY_TARGET}; triggering Daily Drive Editorial Publish"
            before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run daily-drive-editorial-publish.yml --ref main

            run_id=""
            for poll in $(seq 1 30); do
              run_id=$(gh run list \
                --workflow daily-drive-editorial-publish.yml \
                --event workflow_dispatch \
                --branch main \
                --limit 20 \
                --json databaseId,createdAt \
                --jq ".[] | select(.createdAt >= \"${before}\") | .databaseId" | head -n 1)
              if [ -n "$run_id" ]; then break; fi
              sleep 4
            done

            if [ -z "$run_id" ]; then
              echo "Could not locate triggered workflow run on attempt ${attempt}" >&2
              continue
            fi
            gh run watch "$run_id" --exit-status || true
          done

          count="$(count_drive_today)"
          if [ "$count" -ge "$DAILY_TARGET" ]; then
            echo "Recovered LHub/Drive target after final attempt: ${count}/${DAILY_TARGET}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "LHub/Drive daily target still incomplete after recovery: ${count}/${DAILY_TARGET}." >&2
          exit 1
