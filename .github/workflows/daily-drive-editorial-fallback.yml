name: Daily Drive Editorial Fallback

on:
  workflow_dispatch:
  schedule:
    # 10:00 JST every day. Recover only when today's single LHub publication is missing.
    - cron: '0 1 * * *'

permissions:
  actions: write
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Tokyo
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lightweight publication preflight
        id: preflight
        run: python scripts/lhub_daily_preflight.py

      - name: Already published today
        if: steps.preflight.outputs.published == 'true'
        run: |
          echo "Daily Guarantee already satisfied: ${{ steps.preflight.outputs.published_slug }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Recovery exits before dependency setup, API, reserve, tests/build, PR, or deploy." >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger one recovery attempt
        if: steps.preflight.outputs.published != 'true'
        run: |
          set -euo pipefail
          echo "No LHub publication exists for ${{ steps.preflight.outputs.day }}; dispatching one Daily Drive recovery attempt." >> "$GITHUB_STEP_SUMMARY"
          before=$(gh run list --workflow daily-drive-editorial-publish.yml --event workflow_dispatch --branch main --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run daily-drive-editorial-publish.yml --ref main
          run_id=""
          for attempt in $(seq 1 24); do
            run_id=$(gh run list --workflow daily-drive-editorial-publish.yml --event workflow_dispatch --branch main --limit 10 --json databaseId --jq "[.[] | select(.databaseId > $before)] | sort_by(.databaseId) | last | .databaseId // empty")
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "::error::Recovery dispatch could not be traced to an Actions run"
            exit 1
          fi
          echo "Recovery run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id" >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$run_id" --exit-status
          # A successful workflow conclusion may still reflect no selected article:
          # verify the JST-day published source in the actual post-run main tree.
          git fetch origin main
          git checkout --detach origin/main
          python scripts/lhub_daily_preflight.py | grep -q '^published=true >> "$GITHUB_STEP_SUMMARY"
 || {
            echo "::error::Recovery workflow finished without a confirmed daily article"
            exit 1
          } >> "$GITHUB_STEP_SUMMARY"
