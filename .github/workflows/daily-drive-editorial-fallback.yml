name: Daily Drive Editorial Fallback

on:
  workflow_dispatch:
  schedule:
    # 10:00 JST every day. Recover only when today's single LHub publication is missing.
    - cron: '0 1 * * *'

permissions:
  actions: write
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Tokyo
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lightweight publication preflight
        id: preflight
        run: python scripts/lhub_daily_preflight.py

      - name: Already published today
        if: steps.preflight.outputs.published == 'true'
        run: |
          echo "Daily Guarantee already satisfied: ${{ steps.preflight.outputs.published_slug }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Recovery exits before dependency setup, API, reserve, tests/build, PR, or deploy." >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger one recovery attempt
        if: steps.preflight.outputs.published != 'true'
        run: |
          set -euo pipefail
          echo "No LHub publication exists for ${{ steps.preflight.outputs.day }}; dispatching one Daily Drive recovery attempt." >> "$GITHUB_STEP_SUMMARY"
          gh workflow run daily-drive-editorial-publish.yml --ref main
          echo "Recovery dispatch submitted once. The scheduled Daily Drive slots remain the primary retry path." >> "$GITHUB_STEP_SUMMARY"
