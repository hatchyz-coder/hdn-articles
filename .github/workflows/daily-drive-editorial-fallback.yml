name: Daily Drive Editorial Fallback

on:
  workflow_dispatch:
  schedule:
    # 10:00 JST every day. Recover missing Drive slots until two JP/EN pairs exist today.
    - cron: '0 1 * * *'

permissions:
  actions: write
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Tokyo
      GH_TOKEN: ${{ github.token }}
      DAILY_TARGET: '2'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count today's Japanese articles
        id: initial
        run: |
          set -euo pipefail
          today="$(TZ=Asia/Tokyo date +%F)"
          git fetch origin main
          git checkout --detach origin/main
          count=$(grep -RIl --include='*.md' "publishedAt: ${today}" src/content/articles 2>/dev/null | wc -l | tr -d ' ' || true)
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "$count" -ge "$DAILY_TARGET" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "Daily Drive target already satisfied for ${today}: ${count}/${DAILY_TARGET}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "Daily Drive target incomplete for ${today}: ${count}/${DAILY_TARGET}." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Recover missing publication slots
        if: steps.initial.outputs.complete != 'true'
        run: |
          set -euo pipefail
          today="$(TZ=Asia/Tokyo date +%F)"

          # Allow enough attempts to move past quality-gated or transiently failed seeds
          # without lowering the editorial threshold.
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git checkout --detach origin/main
            count=$(grep -RIl --include='*.md' "publishedAt: ${today}" src/content/articles 2>/dev/null | wc -l | tr -d ' ' || true)
            if [ "$count" -ge "$DAILY_TARGET" ]; then
              echo "Recovered daily target: ${count}/${DAILY_TARGET}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "Fallback attempt ${attempt}: ${count}/${DAILY_TARGET}; triggering Daily Drive Editorial Publish"
            before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run daily-drive-editorial-publish.yml --ref main

            run_id=""
            for poll in $(seq 1 30); do
              run_id=$(gh run list \
                --workflow daily-drive-editorial-publish.yml \
                --event workflow_dispatch \
                --branch main \
                --limit 20 \
                --json databaseId,createdAt \
                --jq ".[] | select(.createdAt >= \"${before}\") | .databaseId" | head -n 1)
              if [ -n "$run_id" ]; then break; fi
              sleep 4
            done

            if [ -z "$run_id" ]; then
              echo "Could not locate triggered workflow run on attempt ${attempt}" >&2
              continue
            fi

            gh run watch "$run_id" --exit-status || true
          done

          git fetch origin main
          git checkout --detach origin/main
          count=$(grep -RIl --include='*.md' "publishedAt: ${today}" src/content/articles 2>/dev/null | wc -l | tr -d ' ' || true)
          if [ "$count" -ge "$DAILY_TARGET" ]; then
            echo "Recovered daily target after final attempt: ${count}/${DAILY_TARGET}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Drive editorial target still incomplete after recovery: ${count}/${DAILY_TARGET}." >&2
          exit 1
