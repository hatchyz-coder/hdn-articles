name: Deploy HDN Articles

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ARTICLES_SITE_URL: ${{ vars.ARTICLES_SITE_URL || 'https://hatchyz-coder.github.io' }}
  ARTICLES_BASE_PATH: ${{ vars.ARTICLES_BASE_PATH || '/hdn-articles' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Show deployment target
        run: |
          echo "PUBLIC_SITE_URL=${ARTICLES_SITE_URL}"
          echo "BASE_PATH=${ARTICLES_BASE_PATH}"

      - name: Build article site
        env:
          PUBLIC_SITE_URL: ${{ env.ARTICLES_SITE_URL }}
          BASE_PATH: ${{ env.ARTICLES_BASE_PATH }}
        run: npm run build

      - name: Verify generated article is in build output
        run: |
          grep -R -F "無難な動画では、患者は動かない" dist >/dev/null
          test -f dist/sitemap-index.xml || test -f dist/sitemap-0.xml || test -f dist/sitemap.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "Deployed page: ${PAGE_URL}"

          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "${PAGE_URL}" -o /tmp/index.html; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "GitHub Pages root did not become reachable."
              exit 1
            fi
            sleep 10
          done

          grep -F "無難な動画では、患者は動かない" /tmp/index.html >/dev/null || {
            echo "Published article is not visible on the deployed index."
            exit 1
          }

          for sitemap in sitemap-index.xml sitemap-0.xml sitemap.xml; do
            if curl --fail --silent --show-error --location --max-time 20 "${PAGE_URL}${sitemap}" -o /tmp/sitemap.xml; then
              echo "Sitemap reachable: ${PAGE_URL}${sitemap}"
              exit 0
            fi
          done

          echo "No sitemap endpoint was reachable after deployment."
          exit 1
