name: Deploy HDN Articles

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install

      - name: Install OGP generator dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow

      - name: Generate article OGP images
        run: |
          python scripts/generate_og_images.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = sorted(Path('public/og').glob('*/*.png'))
          if not files:
              raise SystemExit('No OGP images were generated')
          for path in files:
              with Image.open(path) as image:
                  if image.size != (1200, 630):
                      raise SystemExit(f'Unexpected OGP dimensions for {path}: {image.size}')
          print(f'Verified {len(files)} OGP images at 1200x630')
          PY

      - name: Resolve deployment target
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const target = new URL(process.env.PAGES_BASE_URL);
          const trimmedPath = target.pathname.replace(/\/+$/, '');
          const basePath = trimmedPath || '/';

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `PUBLIC_SITE_URL=${target.origin}\nBASE_PATH=${basePath}\n`,
          );

          console.log(`PUBLIC_SITE_URL=${target.origin}`);
          console.log(`BASE_PATH=${basePath}`);
          NODE

      - name: Build article site
        run: npm run build

      - name: Verify generated article is in build output
        run: |
          grep -R -F "無難な動画では、患者は動かない" dist >/dev/null
          test -f dist/sitemap-index.xml || test -f dist/sitemap-0.xml || test -f dist/sitemap.xml
          test -f dist/og/ja/clinic-video-strategy.png
          test -f dist/og/en/clinic-video-strategy.png
          grep -R -F "og/ja/clinic-video-strategy.png" dist/articles/clinic-video-strategy/index.html >/dev/null
          grep -R -F "og/en/clinic-video-strategy.png" dist/en/articles/clinic-video-strategy/index.html >/dev/null

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "Deployed page: ${PAGE_URL}"

          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "${PAGE_URL}" -o /tmp/index.html; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "GitHub Pages root did not become reachable."
              exit 1
            fi
            sleep 10
          done

          grep -F "無難な動画では、患者は動かない" /tmp/index.html >/dev/null || {
            echo "Published article is not visible on the deployed index."
            exit 1
          }

          curl --fail --silent --show-error --location --max-time 20 "${PAGE_URL}og/ja/clinic-video-strategy.png" -o /tmp/og-ja.png
          curl --fail --silent --show-error --location --max-time 20 "${PAGE_URL}og/en/clinic-video-strategy.png" -o /tmp/og-en.png
          test -s /tmp/og-ja.png
          test -s /tmp/og-en.png

          for sitemap in sitemap-index.xml sitemap-0.xml sitemap.xml; do
            if curl --fail --silent --show-error --location --max-time 20 "${PAGE_URL}${sitemap}" -o /tmp/sitemap.xml; then
              echo "Sitemap reachable: ${PAGE_URL}${sitemap}"
              exit 0
            fi
          done

          echo "No sitemap endpoint was reachable after deployment."
          exit 1
