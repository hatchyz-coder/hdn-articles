name: Deploy HDN Articles

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      published_slugs: ${{ steps.changed.outputs.slugs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install

      - name: Install OGP generator dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow

      - name: Detect and validate changed published article pairs
        id: changed
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          try:
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD^", "HEAD"],
                  text=True,
              ).splitlines()
          except subprocess.CalledProcessError:
              changed = []

          slugs = []
          for raw in changed:
              path = Path(raw)
              if path.parent != Path("src/content/articles") or path.suffix != ".md":
                  continue
              if not path.exists():
                  continue
              jp = path.read_text(encoding="utf-8")
              if not re.search(r"(?m)^draft:\s*false\s*$", jp):
                  continue

              slug = path.stem
              en_path = Path("src/content/articles-en") / f"{slug}.md"
              if not en_path.exists():
                  raise SystemExit(f"Published JP article has no EN pair: {slug}")
              en = en_path.read_text(encoding="utf-8")
              if not re.search(r"(?m)^draft:\s*false\s*$", en):
                  raise SystemExit(f"English pair is not published: {slug}")
              slugs.append(slug)

          slugs = sorted(set(slugs))
          print("Changed published JP/EN pairs:", slugs or "none")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("slugs=" + " ".join(slugs) + "\n")
          PY

      - name: Generate article OGP images
        run: |
          python scripts/generate_og_images.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = sorted(Path('public/og').glob('*/*.png'))
          if not files:
              raise SystemExit('No OGP images were generated')
          for path in files:
              with Image.open(path) as image:
                  if image.size != (1200, 630):
                      raise SystemExit(f'Unexpected OGP dimensions for {path}: {image.size}')
          print(f'Verified {len(files)} OGP images at 1200x630')
          PY

      - name: Resolve deployment target
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const target = new URL(process.env.PAGES_BASE_URL);
          const trimmedPath = target.pathname.replace(/\/+$/, '');
          const basePath = trimmedPath || '/';

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `PUBLIC_SITE_URL=${target.origin}\nBASE_PATH=${basePath}\n`,
          );

          console.log(`PUBLIC_SITE_URL=${target.origin}`);
          console.log(`BASE_PATH=${basePath}`);
          NODE

      - name: Build article site
        run: npm run build

      - name: Verify build output for changed article pairs
        env:
          PUBLISHED_SLUGS: ${{ steps.changed.outputs.slugs }}
        run: |
          set -euo pipefail
          test -f dist/sitemap-index.xml || test -f dist/sitemap-0.xml || test -f dist/sitemap.xml

          for slug in $PUBLISHED_SLUGS; do
            test -f "dist/articles/${slug}/index.html" || {
              echo "Missing Japanese build output for ${slug}" >&2
              exit 1
            }
            test -f "dist/en/articles/${slug}/index.html" || {
              echo "Missing English build output for ${slug}" >&2
              exit 1
            }
            test -f "dist/og/ja/${slug}.png" || {
              echo "Missing Japanese OGP for ${slug}" >&2
              exit 1
            }
            test -f "dist/og/en/${slug}.png" || {
              echo "Missing English OGP for ${slug}" >&2
              exit 1
            }
            grep -F "og/ja/${slug}.png" "dist/articles/${slug}/index.html" >/dev/null || {
              echo "Japanese page does not reference its OGP for ${slug}" >&2
              exit 1
            }
            grep -F "og/en/${slug}.png" "dist/en/articles/${slug}/index.html" >/dev/null || {
              echo "English page does not reference its OGP for ${slug}" >&2
              exit 1
            }
            if grep -Eq '^heroImage:[[:space:]]*true[[:space:]]*$' "src/content/articles/${slug}.md"; then
              grep -F 'class="article-hero-image"' "dist/articles/${slug}/index.html" >/dev/null || {
                echo "Japanese page does not render its first-view image for ${slug}" >&2
                exit 1
              }
            fi
            if grep -Eq '^heroImage:[[:space:]]*true[[:space:]]*$' "src/content/articles-en/${slug}.md"; then
              grep -F 'class="article-hero-image"' "dist/en/articles/${slug}/index.html" >/dev/null || {
                echo "English page does not render its first-view image for ${slug}" >&2
                exit 1
              }
            fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed site and changed JP/EN URLs
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PUBLISHED_SLUGS: ${{ needs.build.outputs.published_slugs }}
        run: |
          set -euo pipefail
          echo "Deployed page: ${PAGE_URL}"

          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "${PAGE_URL}" -o /tmp/index.html; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "GitHub Pages root did not become reachable." >&2
              exit 1
            fi
            sleep 10
          done

          for slug in $PUBLISHED_SLUGS; do
            for path in "articles/${slug}/" "en/articles/${slug}/" "og/ja/${slug}.png" "og/en/${slug}.png"; do
              ok=false
              for attempt in 1 2 3 4 5 6; do
                if curl --fail --silent --show-error --location --max-time 20 "${PAGE_URL}${path}" -o /tmp/smoke; then
                  test -s /tmp/smoke
                  ok=true
                  break
                fi
                sleep 10
              done
              if [ "$ok" != true ]; then
                echo "Production URL failed smoke test: ${PAGE_URL}${path}" >&2
                exit 1
              fi
            done
          done

          for sitemap in sitemap-index.xml sitemap-0.xml sitemap.xml; do
            if curl --fail --silent --show-error --location --max-time 20 "${PAGE_URL}${sitemap}" -o /tmp/sitemap.xml; then
              echo "Sitemap reachable: ${PAGE_URL}${sitemap}"
              exit 0
            fi
          done

          echo "No sitemap endpoint was reachable after deployment." >&2
          exit 1

      - name: Verify published for-clinics landing page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          # Check the GitHub Pages target and the visitor-facing custom domain independently.
          for target in "${PAGE_URL%/}/for-clinics/" "https://article.hdnjapan.com/for-clinics/"; do
            echo "Verifying live service page: $target"
            verified=false
            for attempt in 1 2 3 4 5 6 7 8; do
              if curl --fail --silent --show-error --location --max-time 20 "$target" -o /tmp/for-clinics-live.html &&
                 python3 - /tmp/for-clinics-live.html <<'PY'
          import html
          import sys
          from html.parser import HTMLParser
          from pathlib import Path

          class VisibleText(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.hidden = 0

              def handle_starttag(self, tag, attrs):
                  if tag in {"script", "style"}:
                      self.hidden += 1

              def handle_endtag(self, tag):
                  if tag in {"script", "style"}:
                      self.hidden = max(0, self.hidden - 1)

              def handle_data(self, data):
                  if not self.hidden:
                      self.parts.append(data)

          raw = Path(sys.argv[1]).read_text(encoding="utf-8")
          parser = VisibleText()
          parser.feed(raw)
          text = html.unescape(" ".join(parser.parts))
          required = (
              "院長の知識を、",
              "患者さんに届く言葉へ。",
              "110,000",
              "55,000",
              "（税別）",
              "院内で確認・承認",
              "検索順位、AI検索での引用、予約数、患者数の増加は保証しません",
          )
          missing = [term for term in required if term not in text]
          if missing:
              raise SystemExit("Production page is stale or incomplete: " + repr(missing))
          if "記事本数ではなく、" in text or "110,000円（税込）" in text:
              raise SystemExit("Legacy for-clinics content is still present")
          if "consultation-form.html?cta_source=articles_service" not in raw:
              raise SystemExit("Service consultation link is missing")
          print("Production content verified: new headline, tax-exclusive prices, approval, disclaimers and CTA.")
          PY
              then
                verified=true
                break
              fi
              if [ "$attempt" -lt 8 ]; then sleep 10; fi
            done
            if [ "$verified" != true ]; then
              echo "Published for-clinics page did not match approved content: $target" >&2
              exit 1
            fi
          done
