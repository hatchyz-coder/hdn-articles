name: World Frictions Completion Gate

on:
  workflow_dispatch:
    inputs:
      slug:
        description: World Frictions slug to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-canonical-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pass 1 artifact completeness
        run: python scripts/validate_world_frictions_bundle.py --slug "${{ inputs.slug }}" --phase final
      - name: Pass 2 canonical production verification
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          for path in "world-frictions/" "articles/${SLUG}/" "en/articles/${SLUG}/" "og/ja/${SLUG}.png" "og/en/${SLUG}.png"; do
            curl --fail --silent --show-error --location --max-time 20 "https://article.hdnjapan.com/${path}" -o /tmp/wf-gate
            test -s /tmp/wf-gate
          done
      - name: Record strongest verified state
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          {
            echo '## World Frictions completion gate'
            echo
            echo '- Pass 1: artifact completeness PASS'
            echo '- Pass 2: canonical production verification PASS'
            echo '- State: CANONICAL_LIVE'
            echo '- Social state is intentionally not inferred here.'
            echo '- SOCIAL_LIVE requires direct destination evidence and duplicate reconciliation.'
            echo "- Canonical: https://article.hdnjapan.com/articles/${SLUG}/"
          } >> "$GITHUB_STEP_SUMMARY"
